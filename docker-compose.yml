# The whole stack:  docker compose up
#
#   frontend  http://localhost:4200   Angular dev server, proxies the API
#   backend   http://localhost:8001   FastAPI, docs at /docs
#
# The vault is bind-mounted rather than kept in a volume, because it is a git
# repository that must stay readable and editable on the host with the
# application deleted (R7.6, R4.6). Documents written in here are yours.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # The store. Committed to on every write (R4.7).
      - ./vault:/vault
      # Source, so an edit restarts the reloader instead of rebuilding the image.
      - ./backend:/app/backend
    environment:
      LLMDEX_VAULT: /vault
    env_file:
      # Extraction settings (R7.4): LLMDEX_LLM_BASE_URL, _MODEL, _API_KEY.
      # Optional - without it everything except extraction works, and extraction
      # answers 503 saying what to set rather than guessing an endpoint.
      - path: .env
        required: false
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      # Keeps the image's node_modules: the host has its own, built for a
      # different platform, and the bind mount above would otherwise hide them.
      - frontend_node_modules:/app/node_modules
    environment:
      # Where the dev-server proxy sends /models, /ingest, /benchmarks, /health.
      LLMDEX_API_TARGET: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
