[project]
name = "llmdex"
version = "0.1.0"
description = "Turns a Hugging Face model ID into a reviewed specification sheet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
# Tests live beside the code they cover but are not part of the shipped package.
exclude = ["backend/tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits the real Hugging Face API (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
# The package lives at backend/app, so `app` is first-party to isort.
src = ["backend"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
